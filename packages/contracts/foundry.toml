[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 999999
via_ir = false
evm_version = "cancun"
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./parity" },
]

[fmt]
line_length = 110
tab_width = 4

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
